name: playwright screenshots

# Builds the same throwaway WordPress and CiviCRM site as playwright-tests.yml, runs a repository's own screenshot
# command (for example the pictures of its user guide) and opens a pull request with whatever changed in an output
# folder, for a person to review. It never changes a branch by itself, and it runs no tests.
#
# Kept apart from playwright-tests.yml on purpose, so that the test workflow and its callers are not affected. The
# site set-up steps are copied from there: when one changes, change the other (the step names are the same).
#
# The caller's job needs `permissions: contents: write, pull-requests: write`, and the organisation must allow
# GitHub Actions to create pull requests. A pull request opened with GITHUB_TOKEN does not start other workflows,
# so its checks do not run until someone pushes to it.

on:
  workflow_call:
    inputs:
      EXTENSION_NAME:
        description: 'Name of the CiviCRM extension (also the folder it is mounted under)'
        required: false
        default: ${{ github.event.repository.name }}
        type: string
      EXTENSION_KEY:
        description: 'CiviCRM extension key used to enable it (defaults to EXTENSION_NAME)'
        required: false
        default: ''
        type: string
      COMMAND:
        description: 'The command that takes the screenshots, run from PLAYWRIGHT_DIR (for example "npm run docs-images")'
        required: true
        type: string
      OUTPUT_DIR:
        description: 'Folder (relative to the repository root) the command writes into; its changes become the pull request'
        required: true
        type: string
      PLAYWRIGHT_DIR:
        description: 'Directory (relative to the repository root) containing package.json'
        required: false
        default: 'tests/playwright'
        type: string
      SETUP_SCRIPT:
        description: 'Optional script (relative to the repository root) run as www-data in the extension folder before the command, as in playwright-tests.yml'
        required: false
        default: ''
        type: string
      WP_THEME:
        description: 'WordPress theme (a wordpress.org slug) to install and activate'
        required: false
        default: 'twentytwentyfive'
        type: string
      NODE_VERSION:
        description: 'Node.js version to run Playwright with'
        required: false
        default: '20'
        type: string
      PR_BASE:
        description: 'Branch the pull request goes into (defaults to the branch the workflow ran on)'
        required: false
        default: ''
        type: string
      PR_TITLE:
        description: 'Title of the pull request'
        required: false
        default: 'Update screenshots'
        type: string
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  screenshots:
    runs-on: ubuntu-latest

    env:
      DB_NAME: wordpress
      DB_USER: wp_user
      DB_PASS: wp_pass
      DB_ROOT_PASS: root_pass
      DB_HOST: mariadb:3306
      WP_URL: http://localhost:8080
      WP_TITLE: Test Site
      WP_ADMIN_USER: admin
      WP_ADMIN_PASS: admin
      WP_ADMIN_EMAIL: test@example.com
      EXTENSION_KEY: ${{ inputs.EXTENSION_KEY != '' && inputs.EXTENSION_KEY || inputs.EXTENSION_NAME }}
      COMPONENT_DIR: /var/www/html/wp-content/uploads/civicrm/ext/${{ inputs.EXTENSION_NAME }}
      PR_BASE: ${{ inputs.PR_BASE != '' && inputs.PR_BASE || github.ref_name }}

    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_DATABASE: ${{ env.DB_NAME }}
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASS }}
          MYSQL_ROOT_PASSWORD: ${{ env.DB_ROOT_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BASE }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Detect GitHub Actions Docker network
        id: detect-network
        run: |
          NETWORK=$(docker network ls --filter "name=github_" --format "{{ .Name }}" | head -n 1)
          echo "Detected Docker network: $NETWORK"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"

      - name: Start WordPress container
        run: |
          docker run -d --name wordpress \
            --network ${{ steps.detect-network.outputs.network }} \
            -e WORDPRESS_DB_HOST=${{ env.DB_HOST }} \
            -e WORDPRESS_DB_NAME=${{ env.DB_NAME }} \
            -e WORDPRESS_DB_USER=${{ env.DB_USER }} \
            -e WORDPRESS_DB_PASSWORD=${{ env.DB_PASS }} \
            -p 8080:80 \
            -v .:${{ env.COMPONENT_DIR }} \
            docker.io/agilewareprojects/wordpress:pipeline-latest

      - name: Wait for WordPress container startup
        run: |
          echo "Waiting for wp-config.php to exist in the container..."
          for i in {1..30}; do
            if docker exec wordpress test -f /var/www/html/wp-config.php; then
              echo "wp-config.php found!"
              break
            fi
            echo "Still waiting... ($i)"
            sleep 2
          done

          if ! docker exec wordpress test -f /var/www/html/wp-config.php; then
            echo "Timed out waiting for wp-config.php"
            exit 1
          fi

      - name: Install WordPress
        run: |
          docker exec -u www-data wordpress wp core install \
            --url=${{ env.WP_URL }} \
            --title="${{ env.WP_TITLE }}" \
            --admin_user=${{ env.WP_ADMIN_USER }} \
            --admin_password=${{ env.WP_ADMIN_PASS }} \
            --admin_email=${{ env.WP_ADMIN_EMAIL }} \
            --skip-email

      - name: Increase PHP memory limit
        run: |
          # The image's default 128M is enough for plain WordPress, but not
          # for civicrm's own install/upgrade routines (cv core:install has
          # hit "Allowed memory size of 134217728 bytes exhausted" fatals).
          docker exec wordpress bash -c "echo 'memory_limit = 512M' > /usr/local/etc/php/conf.d/zz-memory-limit.ini"
          docker exec wordpress apache2ctl graceful 2>/dev/null || true

      - name: Install and activate the WordPress theme
        run: |
          # Pin a specific, known theme (WP_THEME, Astra unless the caller says otherwise)
          # rather than relying on whichever theme WordPress core ships as its current
          # default - a future WordPress release changing that default would otherwise change
          # the rendered markup out from under these tests with no warning.
          docker exec -u www-data wordpress wp theme install "${{ inputs.WP_THEME }}" --activate

      - name: Configure WordPress permalinks
        run: |
          # CiviCRM's clean URLs (e.g. /civicrm/dashboard) depend on WordPress
          # NOT using the default "Plain" permalink structure - with Plain
          # permalinks, CiviCRM falls back to page_id/query-string URLs
          # instead, which frontend tests written against the documented
          # /civicrm/... paths won't resolve. The actual rewrite *flush*
          # happens later, once civicrm is installed and active - it's the
          # one that persists civicrm's own `civicrm/(.*)` rewrite rule,
          # which civicrm only registers while its plugin is active.
          docker exec -u www-data wordpress wp rewrite structure '/%postname%/' --hard

      - name: Download & install cv and civix
        run: |
          curl -Ls https://download.civicrm.org/cv/cv.phar -o /tmp/cv
          curl -Ls https://download.civicrm.org/civix/civix.phar -o /tmp/civix
          docker cp /tmp/cv wordpress:/usr/local/bin/cv
          docker cp /tmp/civix wordpress:/usr/local/bin/civix
          docker exec wordpress chmod +x /usr/local/bin/cv /usr/local/bin/civix

      - name: Install civicrm
        run: |
          # (Copied from playwright-tests.yml.) An extension repo gets wp-content/uploads/civicrm for free, because its bind mount
          # (.../uploads/civicrm/ext/<name>) makes Docker create the whole parent chain. A
          # plugin repo mounts elsewhere, so the directory only exists if the image ships it -
          # created explicitly here so both component types start from the same state.
          docker exec wordpress mkdir -p wp-content/uploads/civicrm
          docker exec wordpress chown www-data wp-content/ wp-content/uploads wp-content/uploads/civicrm
          # The same bind mount makes Docker create wp-content/uploads/civicrm/ext as root, so a
          # setup script running as www-data could not add a second extension beside the one under
          # test (for example a test-support extension): "Permission denied". Open that folder to the
          # web user too. A plugin repo has no such folder yet, hence the check.
          docker exec wordpress bash -c 'if [ -d wp-content/uploads/civicrm/ext ]; then chown www-data wp-content/uploads/civicrm/ext; fi'
          # -f because core:install PROMPTS when a civicrm.settings.php already exists, and a
          # prompt with no TTY takes its default - abort - and fails the run. The container is
          # rebuilt from the image every run, so overwriting a stale settings file is exactly
          # what we want; with no settings file present the flag changes nothing.
          docker exec -u www-data wordpress cv core:install -f
          docker exec -u www-data wordpress wp plugin activate civicrm

      - name: Create CiviCRM WordPress base page
        run: |
          # CiviCRM's WordPress integration renders itself through a
          # dedicated WordPress page (identified by the "wpBasePage"
          # setting, matched by slug) rather than needing a shortcode in the
          # page body - without this, CiviCRM has no base page to route
          # clean URLs through.
          docker exec -u www-data wordpress wp post create \
            --post_type=page \
            --post_title=CiviCRM \
            --post_name=civicrm \
            --post_status=publish
          docker exec -u www-data wordpress cv api4 Setting.set '{"values": {"wpBasePage": "civicrm"}}'

      - name: Flush WordPress rewrite rules
        run: |
          # Only now - with civicrm active and its base page/setting in
          # place - does civicrm's own rewrite rule (registered while its
          # plugin is active) get included when the rules are persisted.
          # Flushing any earlier would miss it entirely.
          docker exec -u www-data wordpress wp rewrite flush --hard

      - name: Enable extension under test
        run: |
          docker exec -u www-data wordpress cv ext:enable ${{ env.EXTENSION_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ inputs.PLAYWRIGHT_DIR }}/package-lock.json

      - name: Install Playwright test dependencies
        working-directory: ${{ inputs.PLAYWRIGHT_DIR }}
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ${{ inputs.PLAYWRIGHT_DIR }}
        run: npx playwright install --with-deps

      - name: Let the container user write to the checkout
        run: |
          # The checkout is bind mounted into the container where the extension lives, and Docker
          # keeps the runner's ownership of it, so the www-data user the setup script and the
          # test helpers run as cannot create files there. Setup scripts typically write what
          # the tests read (for example generated fixture files under tests/), so open it up.
          chmod -R a+rwX .

      - name: Run repo-specific test environment setup
        if: ${{ inputs.SETUP_SCRIPT != '' }}
        run: |
          docker exec -u www-data -w ${{ env.COMPONENT_DIR }} wordpress bash "${{ inputs.SETUP_SCRIPT }}"

      - name: Let the runner use what the setup script created
        if: ${{ inputs.SETUP_SCRIPT != '' }}
        run: |
          # The setup script ran as www-data, so what it created in the checkout (generated fixture
          # files and their folders) belongs to www-data, and Playwright, which runs as the
          # runner's user, could not add to those folders (for example its saved login sessions).
          sudo chmod -R a+rwX .

      - name: Take the screenshots
        working-directory: ${{ inputs.PLAYWRIGHT_DIR }}
        env:
          BASE_URL: ${{ env.WP_URL }}
          WP_ADMIN_USER: ${{ env.WP_ADMIN_USER }}
          WP_ADMIN_PASS: ${{ env.WP_ADMIN_PASS }}
          CIVI_EXEC_PREFIX: docker exec -u www-data -w ${{ env.COMPONENT_DIR }} wordpress
          COMMAND: ${{ inputs.COMMAND }}
        run: bash -c "$COMMAND"

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ inputs.OUTPUT_DIR }}
          retention-days: 14

      - name: Open a pull request with what changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ inputs.OUTPUT_DIR }}
          PR_TITLE: ${{ inputs.PR_TITLE }}
        run: |
          git add -A -- "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "Nothing changed in $OUTPUT_DIR: no pull request."
            exit 0
          fi
          BRANCH="screenshots/${PR_BASE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -m "$PR_TITLE"
          git push -q origin "$BRANCH"
          CHANGED=$(git diff --name-only HEAD~1 | wc -l)
          printf '%s\n\n%s\n\n%s\n' \
            "Screenshots taken by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (${CHANGED} files in \`${OUTPUT_DIR}\`)." \
            "Look at each picture before merging: every run changes them (they show dates)." \
            "The pictures are also attached to the run as the \`screenshots\` artifact." > /tmp/pr-body.md
          gh pr create --base "$PR_BASE" --head "$BRANCH" --title "$PR_TITLE" --body-file /tmp/pr-body.md

      - name: Collect docker logs on failure
        if: failure()
        run: docker logs wordpress > wordpress.log 2>&1 || true

      - name: Upload docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: wordpress.log
          retention-days: 7
