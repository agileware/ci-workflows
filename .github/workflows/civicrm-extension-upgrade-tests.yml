name: CiviCRM extension upgrade test

on:
  workflow_call:
    inputs:
      EXTENSION_NAME:
        description: 'Name of the CiviCRM extension (also the folder it is mounted under, and its key)'
        required: false
        default: ${{ github.event.repository.name }}
        type: string
      FROM_REF:
        description: 'Git tag, branch or commit of the OLD version to install first (e.g. 1.3.2). The extension is upgraded from this to the commit being tested.'
        required: true
        type: string
      UPGRADE_SCRIPT:
        description: >
          Path (relative to the repo root) of the repo-specific shell script that performs the test inside the
          container, as www-data. It is run from the version being tested. See the README for what it is given
          and what it must do.
        required: false
        default: 'tests/upgrade/ci-upgrade-test.sh'
        type: string
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  upgrade:
    runs-on: ubuntu-latest

    env:
      DB_NAME: wordpress
      DB_USER: wp_user
      DB_PASS: wp_pass
      DB_ROOT_PASS: root_pass
      DB_HOST: mariadb:3306
      WP_URL: http://localhost:8080
      WP_TITLE: Test Site
      WP_ADMIN_USER: admin
      WP_ADMIN_PASS: admin
      WP_ADMIN_EMAIL: test@example.com
      EXTENSION_DIR: /var/www/html/wp-content/uploads/civicrm/ext/${{ inputs.EXTENSION_NAME }}
      NEW_VERSION_DIR: /upgrade-to/${{ inputs.EXTENSION_NAME }}

    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_DATABASE: ${{ env.DB_NAME }}
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASS }}
          MYSQL_ROOT_PASSWORD: ${{ env.DB_ROOT_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout the version being tested
        uses: actions/checkout@v4
        with:
          path: new-version

      - name: Checkout the old version to upgrade from
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.FROM_REF }}
          path: old-version

      - name: Let the container user write to the old version's folder
        run: |
          # The old version's folder is bind mounted where the extension is installed, and the test
          # script replaces its contents with the new version to upgrade it, as www-data. Docker
          # keeps the runner's ownership of a bind mount, so open it up.
          chmod -R a+rwX old-version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Detect GitHub Actions Docker network
        id: detect-network
        run: |
          NETWORK=$(docker network ls --filter "name=github_" --format "{{ .Name }}" | head -n 1)
          echo "Detected Docker network: $NETWORK"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"

      - name: Start WordPress container
        run: |
          # The OLD version sits where the extension lives, so it is what gets installed. The version
          # being tested is mounted read-only beside it for the test script to copy over it.
          docker run -d --name wordpress \
            --network ${{ steps.detect-network.outputs.network }} \
            -e WORDPRESS_DB_HOST=${{ env.DB_HOST }} \
            -e WORDPRESS_DB_NAME=${{ env.DB_NAME }} \
            -e WORDPRESS_DB_USER=${{ env.DB_USER }} \
            -e WORDPRESS_DB_PASSWORD=${{ env.DB_PASS }} \
            -p 8080:80 \
            -v ./old-version:${{ env.EXTENSION_DIR }} \
            -v ./new-version:${{ env.NEW_VERSION_DIR }}:ro \
            docker.io/agilewareprojects/wordpress:pipeline-latest

      - name: Wait for WordPress container startup
        run: |
          echo "Waiting for wp-config.php to exist in the container..."
          for i in {1..30}; do
            if docker exec wordpress test -f /var/www/html/wp-config.php; then
              echo "wp-config.php found!"
              break
            fi
            echo "Still waiting... ($i)"
            sleep 2
          done

          if ! docker exec wordpress test -f /var/www/html/wp-config.php; then
            echo "Timed out waiting for wp-config.php"
            exit 1
          fi

      - name: Install WordPress
        run: |
          docker exec -u www-data wordpress wp core install \
            --url=${{ env.WP_URL }} \
            --title="${{ env.WP_TITLE }}" \
            --admin_user=${{ env.WP_ADMIN_USER }} \
            --admin_password=${{ env.WP_ADMIN_PASS }} \
            --admin_email=${{ env.WP_ADMIN_EMAIL }} \
            --skip-email

      - name: Increase PHP memory limit
        run: |
          docker exec wordpress bash -c "echo 'memory_limit = 512M' > /usr/local/etc/php/conf.d/zz-memory-limit.ini"
          docker exec wordpress apache2ctl graceful 2>/dev/null || true

      - name: Download & install cv
        run: |
          curl -Ls https://download.civicrm.org/cv/cv.phar -o /tmp/cv
          docker cp /tmp/cv wordpress:/usr/local/bin/cv
          docker exec wordpress chmod +x /usr/local/bin/cv

      - name: Install civicrm
        run: |
          docker exec wordpress mkdir -p wp-content/uploads/civicrm
          docker exec wordpress chown www-data wp-content/ wp-content/uploads wp-content/uploads/civicrm
          docker exec -u www-data wordpress cv core:install -f
          docker exec -u www-data wordpress wp plugin activate civicrm

      - name: Run the upgrade test
        run: |
          # Runs the script of the version being tested, from its own folder. It is given:
          #   EXTENSION_KEY      the extension's key (the old version is mounted at EXTENSION_DIR)
          #   EXTENSION_DIR      where the extension is installed from, holding the OLD version
          #   NEW_VERSION_DIR    the version being tested, read-only
          # It must install the old version, seed it with data, replace the contents of EXTENSION_DIR
          # with NEW_VERSION_DIR, upgrade (cv ext:upgrade-db) and check the result, and exit
          # non-zero if anything is wrong.
          docker exec -u www-data \
            -w ${{ env.NEW_VERSION_DIR }} \
            -e PWD=${{ env.NEW_VERSION_DIR }} \
            -e EXTENSION_KEY=${{ inputs.EXTENSION_NAME }} \
            -e EXTENSION_DIR=${{ env.EXTENSION_DIR }} \
            -e NEW_VERSION_DIR=${{ env.NEW_VERSION_DIR }} \
            wordpress bash "${{ env.NEW_VERSION_DIR }}/${{ inputs.UPGRADE_SCRIPT }}"

      - name: Collect docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2.2.2
        with:
          dest: './logs'

      - name: Tar logs
        if: failure()
        run: tar cvzf ./logs.tgz ./logs

      - name: Upload logs to GitHub
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs.tgz
          path: ./logs.tgz
