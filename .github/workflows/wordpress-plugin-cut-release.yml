name: wordpress plugin cut release

on:
  workflow_call:
    inputs:
      VERSION:
        description: 'Version to release, matching the calling repo''s tag naming (e.g. 2.0.6)'
        required: true
        type: string
      VERSION_FILE:
        description: 'Path (relative to the repo root) to the plugin file whose "Version:" header must match VERSION'
        required: true
        type: string
      EXCLUDE_PATHS:
        description: 'Space-separated repo-relative paths to drop from the release branch (e.g. "tests .github CONTRIBUTING.md")'
        required: true
        type: string
      RELEASE_BRANCH:
        description: 'Branch that only ever holds filtered, release-ready content. Must already exist.'
        required: false
        default: 'release'
        type: string
      PLUGIN_NAME:
        description: 'Human-readable plugin name, used only in commit/log messages'
        required: false
        default: ${{ github.event.repository.name }}
        type: string

permissions:
  contents: write

jobs:
  cut-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release branch
        run: |
          # The release branch is created once, manually, when a repo first adopts this
          # workflow (see ci-workflows README). This job only ever updates it, it never
          # bootstraps it, so a missing branch here is a setup problem, not something to
          # silently paper over.
          if ! git fetch origin "${{ inputs.RELEASE_BRANCH }}:${{ inputs.RELEASE_BRANCH }}"; then
            echo "::error::Branch '${{ inputs.RELEASE_BRANCH }}' does not exist on origin. Create it before running this workflow."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify version header matches VERSION input
        run: |
          # Catches the case where someone dispatches this workflow with a version that
          # doesn't match what's actually in the plugin header on the branch being released,
          # which would otherwise tag/publish a release under the wrong version number.
          # \s* (not a fixed single \s) because plugin headers commonly align this column with
          # multiple spaces (e.g. "Version:           1.32.7"), and \K keeps the match starting
          # at the value rather than needing a fixed-width lookbehind. The explicit `|| {`
          # matters too: under bash -e (GitHub Actions' default), a plain failed grep would abort
          # the step right here with nothing but a bare "exit code 1", before the error below
          # ever printed.
          HEADER_VERSION=$(grep -m1 -oP 'Version:\s*\K\S+' "${{ inputs.VERSION_FILE }}") || {
            echo "::error::Could not find a 'Version:' header in ${{ inputs.VERSION_FILE }}."
            exit 1
          }
          if [ "$HEADER_VERSION" != "${{ inputs.VERSION }}" ]; then
            echo "::error::${{ inputs.VERSION_FILE }} has Version: $HEADER_VERSION, but this run was dispatched with VERSION=${{ inputs.VERSION }}. Bump the header and merge that first."
            exit 1
          fi

      - name: Build filtered tree onto the release branch
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          git checkout "${{ inputs.RELEASE_BRANCH }}"

          # Reset release's tip to *be* the source commit, not a fresh commit copying its
          # tree on top of release's own prior history. That distinction matters: an earlier
          # version of this workflow used `git rm` + `git checkout "$SOURCE_SHA" -- .` to copy
          # file contents while leaving release's own commit as the parent, which silently
          # broke `gh release create --generate-notes` (and any other ancestry-based
          # changelog): commits merged on the source branch were never actual ancestors of
          # the release branch, so GitHub had nothing to walk. Resetting instead makes every
          # commit reachable from `main`/`master` also reachable from `release`, so tags and
          # generated release notes see the real history.
          git reset --hard "$SOURCE_SHA"

          for path in ${{ inputs.EXCLUDE_PATHS }}; do
            git rm -rq --ignore-unmatch -- "$path"
          done

      - name: Commit, tag, and push
        run: |
          if git diff --cached --quiet; then
            echo "No changes to release, ${{ inputs.RELEASE_BRANCH }} already matches this version's filtered tree."
          else
            git commit -m "Release ${{ inputs.VERSION }}"
          fi
          git tag "${{ inputs.VERSION }}"
          # --force: release's tip after the reset above is a descendant of the source
          # branch, not of release's own previous tip (which carried its own now-discarded
          # strip commit), so this is essentially always a non-fast-forward update. That's
          # expected for a branch nobody is meant to develop on directly.
          git push --force origin "${{ inputs.RELEASE_BRANCH }}"
          git push origin "${{ inputs.VERSION }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The bundled updater in these plugins reads GET /repos/{owner}/{repo}/releases/latest
          # and downloads its zipball_url, an archive of whatever commit the tag points at - so
          # this is what makes the filtered tree above actually reach client sites.
          gh release create "${{ inputs.VERSION }}" \
            --target "${{ inputs.RELEASE_BRANCH }}" \
            --title "${{ inputs.VERSION }}" \
            --generate-notes
