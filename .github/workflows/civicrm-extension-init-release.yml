name: civicrm extension init release

on:
  workflow_call:
    inputs:
      EXCLUDE_PATHS:
        description: 'Space-separated repo-relative paths to drop from the release branch (e.g. ".github tests .idea")'
        required: true
        type: string
      RELEASE_BRANCH:
        description: 'Branch that will only ever hold filtered, release-ready content. Created by this workflow, must not already exist.'
        required: false
        default: 'release'
        type: string
      EXTENSION_NAME:
        description: 'Human-readable extension name, used only in commit/log messages'
        required: false
        default: ${{ github.event.repository.name }}
        type: string

permissions:
  contents: write
  workflows: write

jobs:
  init-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify this is a CiviCRM extension
        run: |
          # The cut-release workflow this sets up always reads version/releaseDate from
          # info.xml, so there's nothing sensible to initialise if it's missing.
          if [ ! -f info.xml ]; then
            echo "::error::No info.xml at the repo root. This workflow only sets up CiviCRM extensions."
            exit 1
          fi

      - name: Guard against double-init
        run: |
          # Re-running this against an already-initialised repo would silently overwrite a
          # hand-tuned cut-release.yml, or try to recreate a release branch whose history has
          # since diverged from a real cut. A repo only gets initialised once; after that,
          # changes to EXCLUDE_PATHS or the release branch are made by hand.
          if [ -f .github/workflows/cut-release.yml ]; then
            echo "::error::.github/workflows/cut-release.yml already exists, this repo looks already initialised."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "${{ inputs.RELEASE_BRANCH }}" > /dev/null 2>&1; then
            echo "::error::Branch '${{ inputs.RELEASE_BRANCH }}' already exists on origin, this repo looks already initialised."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Cut release workflow and process note
        run: |
          mkdir -p .github/workflows

          # The nested ${{ '${{' }} is the standard trick for getting a literal ${{ }}
          # expression into a file generated from inside a run: step: GitHub evaluates it to
          # the 3-character string "${{" in a single textual pass, before bash ever sees this
          # script, so the result sits inert in cut-release.yml rather than being evaluated
          # again. EXCLUDE_PATHS below is the opposite: it's meant to be evaluated right here,
          # baking this repo's actual exclude list into the generated file as a literal string.
          cat > .github/workflows/cut-release.yml <<'YAML'
          name: Cut release

          on:
            workflow_dispatch:
              inputs:
                VERSION:
                  description: 'Version to release (must match <version> in info.xml)'
                  required: true
                  type: string

          permissions:
            contents: write

          jobs:
            cut-release:
              uses: agileware/ci-workflows/.github/workflows/civicrm-extension-cut-release.yml@main
              with:
                VERSION: ${{ '${{' }} inputs.VERSION }}
                EXCLUDE_PATHS: "${{ inputs.EXCLUDE_PATHS }}"
          YAML

          FORMATTED=""
          for path in ${{ inputs.EXCLUDE_PATHS }}; do
            FORMATTED="${FORMATTED}\`${path}\`, "
          done
          FORMATTED="${FORMATTED%, }"

          cat > CONTRIBUTING.md <<MARKDOWN
          # Contributing

          ## Versioning and releases

          - The extension version lives in the \`<version>\` element of \`info.xml\`. Bump it, and
            \`<releaseDate>\`, on \`master\` as part of any release.
          - Releases are cut from a \`release\` branch, not \`master\` directly, so that $FORMATTED
            never reach client sites (civicrm.org's extension directory installs whatever a
            version tag points at, in full).
          - To cut a release: bump \`<version>\`/\`<releaseDate>\` on \`master\` and merge that, then
            run **Cut release** from the Actions tab with a version matching what you just bumped.
            It builds the filtered \`release\` branch, tags it, and publishes the GitHub Release.
          MARKDOWN

      - name: Add civix upgrade workflow if missing
        run: |
          if [ ! -f .github/workflows/civix-upgrade.yml ]; then
            cat > .github/workflows/civix-upgrade.yml <<'YAML'
          name: civix upgrade
          on:
            workflow_dispatch: {}

          jobs:
            civix-upgrade:
              uses: agileware/ci-workflows/.github/workflows/civix-upgrade.yml@main
              secrets:
                DOCKERHUB_USER: ${{ '${{' }} secrets.DOCKERHUB_USER }}
                DOCKERHUB_TOKEN: ${{ '${{' }} secrets.DOCKERHUB_TOKEN }}
              with:
                EXTENSION_NAME: ${{ github.event.repository.name }}
          YAML
            echo "Added civix-upgrade.yml"
          else
            echo "civix-upgrade.yml already exists, leaving it alone"
          fi

      - name: Add PHPUnit tests workflow if missing
        run: |
          # Only added when the repo actually has a PHPUnit suite configured, otherwise this
          # would add a CI workflow that fails on every run with nothing to test.
          if [ -f phpunit.xml.dist ] && [ ! -f .github/workflows/phpunit-tests.yml ]; then
            cat > .github/workflows/phpunit-tests.yml <<'YAML'
          name: PHPUnit tests

          on:
            push: {}
            workflow_dispatch: {}

          jobs:
            phpunit:
              uses: agileware/ci-workflows/.github/workflows/civicrm-phpunit-tests.yml@main
              secrets:
                DOCKERHUB_USER: ${{ '${{' }} secrets.DOCKERHUB_USER }}
                DOCKERHUB_TOKEN: ${{ '${{' }} secrets.DOCKERHUB_TOKEN }}
              with:
                EXTENSION_NAME: ${{ github.event.repository.name }}
          YAML
            echo "Added phpunit-tests.yml"
          else
            echo "Skipped phpunit-tests.yml (no phpunit.xml.dist, or it already exists)"
          fi

      - name: Add Playwright frontend tests workflow if missing
        run: |
          # Same reasoning as PHPUnit above: only added when a Playwright suite actually
          # exists. SETUP_SCRIPT is optional on the reusable workflow itself, so it's included
          # only when this repo follows the fixtures/setup-environment.sh convention already
          # used elsewhere; otherwise it's simply left out rather than guessed at.
          if [ -f tests/playwright/playwright.config.ts ] && [ ! -f .github/workflows/frontend-tests.yml ]; then
            # Bash variables, not the usual ${{ '${{' }} trick, because this step also needs
            # real bash expansion (for SETUP_SCRIPT_LINE below), and the two don't mix cleanly
            # inside the same heredoc: once GitHub's own substitution reduces ${{ '${{' }} down
            # to a literal ${{, an *unquoted* heredoc would hand that straight to bash, which
            # would then try (and fail) to parse it as its own parameter expansion.
            OPEN='${{'
            CLOSE='}}'
            if [ -f tests/playwright/fixtures/setup-environment.sh ]; then
              SETUP_SCRIPT_LINE="
                SETUP_SCRIPT: tests/playwright/fixtures/setup-environment.sh"
            else
              SETUP_SCRIPT_LINE=""
            fi
            cat > .github/workflows/frontend-tests.yml <<YAML
          name: frontend tests

          on:
            push:
              branches: [${{ github.event.repository.default_branch }}]
            pull_request:
            workflow_dispatch: {}

          jobs:
            playwright:
              uses: agileware/ci-workflows/.github/workflows/playwright-tests.yml@main
              secrets:
                DOCKERHUB_USER: $OPEN secrets.DOCKERHUB_USER $CLOSE
                DOCKERHUB_TOKEN: $OPEN secrets.DOCKERHUB_TOKEN $CLOSE
              with:
                EXTENSION_NAME: ${{ github.event.repository.name }}$SETUP_SCRIPT_LINE
          YAML
            echo "Added frontend-tests.yml"
          else
            echo "Skipped frontend-tests.yml (no tests/playwright/playwright.config.ts, or it already exists)"
          fi

      - name: Commit and push workflow files
        run: |
          git add -A -- .github/workflows CONTRIBUTING.md
          git commit -m "Add release and CI workflows"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create release branch
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          git checkout -b "${{ inputs.RELEASE_BRANCH }}"
          for path in ${{ inputs.EXCLUDE_PATHS }}; do
            git rm -rq --ignore-unmatch -- "$path"
          done
          git commit -m "Start release branch: strip dev-only files"
          git push origin "${{ inputs.RELEASE_BRANCH }}"
