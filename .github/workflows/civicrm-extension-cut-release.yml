name: civicrm extension cut release

on:
  workflow_call:
    inputs:
      VERSION:
        description: 'Version to release, matching the calling repo''s tag naming (e.g. 2.0.2)'
        required: true
        type: string
      EXCLUDE_PATHS:
        description: 'Space-separated repo-relative paths to drop from the release branch (e.g. ".github tests mkdocs.yml")'
        required: true
        type: string
      RELEASE_BRANCH:
        description: 'Branch that only ever holds filtered, release-ready content. Must already exist.'
        required: false
        default: 'release'
        type: string
      EXTENSION_NAME:
        description: 'Human-readable extension name, used only in commit/log messages'
        required: false
        default: ${{ github.event.repository.name }}
        type: string

permissions:
  contents: write

jobs:
  cut-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch release branch
        run: |
          # The release branch is created once, manually, when a repo first adopts this
          # workflow (see ci-workflows README). This job only ever updates it, it never
          # bootstraps it, so a missing branch here is a setup problem, not something to
          # silently paper over.
          if ! git fetch origin "${{ inputs.RELEASE_BRANCH }}:${{ inputs.RELEASE_BRANCH }}"; then
            echo "::error::Branch '${{ inputs.RELEASE_BRANCH }}' does not exist on origin. Create it before running this workflow."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify info.xml version matches VERSION input
        run: |
          # Every CiviCRM extension has info.xml at its root by convention, so unlike the
          # WordPress workflow this never needs a per-repo file path input. The explicit
          # `|| {` matters: under bash -e (GitHub Actions' default), a plain failed grep would
          # abort the step right here with nothing but a bare "exit code 1", before the error
          # below ever printed (this bit us for real on the WordPress version of this check).
          INFO_VERSION=$(grep -m1 -oP '(?<=<version>)[^<]+' info.xml) || {
            echo "::error::Could not find a <version> element in info.xml."
            exit 1
          }
          if [ "$INFO_VERSION" != "${{ inputs.VERSION }}" ]; then
            echo "::error::info.xml has <version>$INFO_VERSION</version>, but this run was dispatched with VERSION=${{ inputs.VERSION }}. Bump it (and <releaseDate>) and merge that first."
            exit 1
          fi

      - name: Checkout ci-workflows docs template
        uses: actions/checkout@v4
        with:
          repository: agileware/ci-workflows
          path: .ci-workflows-docs-template

      - name: Ensure mkdocs.yml exists
        run: |
          # Every extension documented this way gets the same mkdocs-material scaffold, only
          # site_name/repo_url/site_description vary, pulled from info.xml and the repo itself.
          if [ ! -f mkdocs.yml ]; then
            NAME=$(grep -m1 -oP '(?<=<name>)[^<]+' info.xml) || {
              echo "::error::Could not find a <name> element in info.xml to build mkdocs.yml from."
              exit 1
            }
            SITE_NAME="$NAME for CiviCRM"
            SITE_DESCRIPTION="A guide for the $NAME CiviCRM extension."
            REPO_URL="https://github.com/${{ github.repository }}"
            sed \
              -e "s|__SITE_NAME__|$SITE_NAME|" \
              -e "s|__REPO_URL__|$REPO_URL|" \
              -e "s|__SITE_DESCRIPTION__|$SITE_DESCRIPTION|" \
              .ci-workflows-docs-template/docs-template/mkdocs.yml > mkdocs.yml
            echo "Created mkdocs.yml"
          fi

      - name: Ensure docs/README.md exists
        id: docs_readme
        run: |
          mkdir -p docs
          # A move, not a copy: a duplicate root README would immediately drift from the
          # docs/ copy (which gets absolute-ified links below), and civicrm.org/GitHub have no
          # need for a second copy once Documentation points at docs/README.md.
          MOVED=false
          if [ ! -f docs/README.md ] && [ -f README.md ]; then
            git mv README.md docs/README.md
            MOVED=true
            echo "Moved README.md to docs/README.md"
          fi
          echo "moved=$MOVED" >> "$GITHUB_OUTPUT"

      - name: Make docs/README.md links absolute
        run: |
          # mkdocs only serves files under docs/, so a link like ../LICENSE.txt or
          # img/foo.png that resolves correctly when GitHub renders this file in place breaks
          # once the same file is built into a standalone mkdocs site. Rewriting every
          # relative link/image to its absolute github.com blob/raw URL works identically in
          # both places. Verified against this org's own prior hand-made conversions
          # (au.com.agileware.ewayrecurring's "Use absolute GitHub URLs" commit, and
          # au.com.agileware.eventmanagelocations' original move) before this step was ever
          # used for real: running it against each commit's "before" file reproduced the real
          # "after" file byte for byte.
          if [ -f docs/README.md ]; then
            # A README just moved from the repo root this run still has links written relative
            # to the root (e.g. LICENSE.txt, tests/playwright/README.md); one that already
            # lived in docs/ (from a prior run, or a repo that started there) has links written
            # relative to docs/ itself (e.g. UPGRADE.md, img/foo.png, logo/foo.png). Resolve
            # against whichever base matches, or every link in a freshly-moved README would
            # silently gain a spurious extra docs/ segment.
            if [ "${{ steps.docs_readme.outputs.moved }}" = "true" ]; then
              BASE_DIR="."
            else
              BASE_DIR="docs"
            fi
            python3 - "${{ github.repository }}" "${{ github.event.repository.default_branch }}" docs/README.md "$BASE_DIR" <<'PYEOF'
          import re, os, sys

          repo, branch, path, base_dir = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          with open(path) as f:
              content = f.read()

          link_pattern = re.compile(r'(!?)\[([^\]]*)\]\(([^)\s]+)(\s+"[^"]*")?\)')

          def is_absolute(url):
              return re.match(r'^[a-zA-Z][a-zA-Z0-9+.-]*:', url) is not None or url.startswith('//') or url.startswith('#')

          def resolve(url):
              if is_absolute(url):
                  return None
              # The Agileware logo always ends up at this fixed path (see the next step), even
              # though this step runs before that move happens, so the generic base_dir
              # resolution below would still point at wherever it used to live, a prior
              # step's root-vs-docs ambiguity doesn't apply to an asset whose destination is
              # already known for certain.
              if os.path.basename(url) == 'agileware-logo.png':
                  return 'docs/logo/agileware-logo.png'
              resolved = os.path.normpath(os.path.join(base_dir, url)).replace(os.sep, '/')
              if resolved.startswith('../'):
                  return None
              return resolved

          def replace(m):
              bang, text, url, title = m.group(1), m.group(2), m.group(3), m.group(4) or ''
              resolved = resolve(url)
              if resolved is None:
                  return m.group(0)
              kind = 'raw' if bang == '!' else 'blob'
              return f'{bang}[{text}](https://github.com/{repo}/{kind}/{branch}/{resolved}{title})'

          new_content = link_pattern.sub(replace, content)
          if new_content != content:
              with open(path, 'w') as f:
                  f.write(new_content)
              print(f"::notice::Rewrote relative links in {path} to absolute GitHub URLs")
          PYEOF
          fi

      - name: Ensure docs/logo/agileware-logo.png exists
        run: |
          if [ ! -f docs/logo/agileware-logo.png ]; then
            mkdir -p docs/logo
            cp .ci-workflows-docs-template/docs-template/logo/agileware-logo.png docs/logo/agileware-logo.png
            echo "Copied agileware-logo.png from ci-workflows docs-template"

            # Superseded by docs/logo/ above: an old root-level logo/agileware-logo.png (from
            # before this extension had a docs/ structure) is now unreferenced, since
            # docs/README.md's own logo link points at docs/logo/ instead. Remove just the
            # file via git, then the directory too, but only if that leaves it empty, in case
            # some repo's root logo/ ever holds something else alongside it.
            if [ -f logo/agileware-logo.png ]; then
              git rm -q -- logo/agileware-logo.png
              rmdir logo 2>/dev/null || true
              echo "Removed old root logo/agileware-logo.png, superseded by docs/logo/"
            fi
          fi

      - name: Update info.xml Documentation URL
        run: |
          # The extension's documentation now lives at docs/README.md, not README.md, so
          # civicrm.org's extension directory (which reads this straight from info.xml) needs
          # to be pointed at the new location.
          DOC_URL="https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/docs/README.md"
          python3 - "$DOC_URL" info.xml <<'PYEOF'
          import re, sys

          doc_url, path = sys.argv[1], sys.argv[2]
          with open(path) as f:
              content = f.read()

          full = re.compile(r'(<url desc="Documentation">)(.*?)(</url>)', re.DOTALL)
          selfclosing = re.compile(r'<url desc="Documentation"\s*/>')
          main_page = re.compile(r'(<url desc="Main Extension Page">.*?</url>\n)')

          m = full.search(content)
          if m:
              if m.group(2) == doc_url:
                  sys.exit(0)
              content = full.sub(lambda m: m.group(1) + doc_url + m.group(3), content, count=1)
          elif selfclosing.search(content):
              content = selfclosing.sub(f'<url desc="Documentation">{doc_url}</url>', content, count=1)
          elif main_page.search(content):
              content = main_page.sub(lambda m: m.group(1) + f'    <url desc="Documentation">{doc_url}</url>\n', content, count=1)
          else:
              print("::error::Could not find a <urls> block in info.xml to add the Documentation URL")
              sys.exit(1)

          with open(path, 'w') as f:
              f.write(content)
          print(f"::notice::Set info.xml Documentation URL to {doc_url}")
          PYEOF

      - name: Commit and push docs structure changes
        run: |
          # Scoped pathspecs, not `git add -A`: .ci-workflows-docs-template/ (checked out
          # above) sits untracked in this same working directory and must never be staged.
          git add -A -- mkdocs.yml docs info.xml
          if git diff --cached --quiet; then
            echo "Docs structure already up to date, nothing to commit."
          else
            git commit -m "Standardise extension docs structure (mkdocs.yml, docs/, absolute links)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build filtered tree onto the release branch
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          git checkout "${{ inputs.RELEASE_BRANCH }}"

          # Mirror the source commit's tree onto the release branch with plain git
          # Reset release's tip to *be* the source commit, not a fresh commit copying its
          # tree on top of release's own prior history. That distinction matters: an earlier
          # version of this workflow used `git rm` + `git checkout "$SOURCE_SHA" -- .` to copy
          # file contents while leaving release's own commit as the parent, which silently
          # broke `gh release create --generate-notes` (and any other ancestry-based
          # changelog): commits merged on the source branch were never actual ancestors of
          # the release branch, so GitHub had nothing to walk. Resetting instead makes every
          # commit reachable from the extension's default branch also reachable from
          # `release`, so tags and generated release notes see the real history.
          git reset --hard "$SOURCE_SHA"

          # phpunit.xml.dist is always stripped regardless of EXCLUDE_PATHS: it's PHPUnit's own
          # test-suite config, useless without tests/ (already excluded by convention), and has
          # no runtime purpose on a client site.
          for path in ${{ inputs.EXCLUDE_PATHS }} phpunit.xml.dist; do
            git rm -rq --ignore-unmatch -- "$path"
          done

      - name: Commit, tag, and push
        run: |
          if git diff --cached --quiet; then
            echo "No changes to release, ${{ inputs.RELEASE_BRANCH }} already matches this version's filtered tree."
          else
            git commit -m "Release ${{ inputs.VERSION }}"
          fi
          git tag "${{ inputs.VERSION }}"
          # --force: release's tip after the reset above is a descendant of the source
          # branch, not of release's own previous tip (which carried its own now-discarded
          # strip commit), so this is essentially always a non-fast-forward update. That's
          # expected for a branch nobody is meant to develop on directly.
          git push --force origin "${{ inputs.RELEASE_BRANCH }}"
          git push origin "${{ inputs.VERSION }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # civicrm.org's extension directory reads the tag's tree directly (via info.xml),
          # it doesn't need a GitHub Release to exist. This is created anyway because every
          # existing tag on these repos already has one, for changelog visibility.
          # --latest is explicit rather than left to gh's "automatic based on date and version"
          # default: that auto-detection can fail to flag a release as latest at all on a repo
          # whose tag history mixes version formats (e.g. a bare "1.1" alongside "1.1.1",
          # "2.0.1", ...), which is exactly what happened on the first cut of this workflow.
          gh release create "${{ inputs.VERSION }}" \
            --target "${{ inputs.RELEASE_BRANCH }}" \
            --title "${{ inputs.VERSION }}" \
            --latest \
            --generate-notes

      - name: Notify docs.civicrm.org to rebuild documentation
        run: |
          # docs.civicrm.org publishes each extension's docs/mkdocs.yml (see the steps above)
          # under a URL keyed by the <file> element in info.xml, lowercased, e.g.
          # au.com.agileware.civiquickbooks -> https://docs.civicrm.org/admin/publish/civiquickbooks/en/master.
          # This is a best-effort ping, not published here: the release itself (tag, GitHub
          # Release) is already complete by this point regardless of whether it succeeds.
          SHORTNAME=$(grep -m1 -oP '(?<=<file>)[^<]+' info.xml | tr '[:upper:]' '[:lower:]') || {
            echo "::error::Could not find a <file> element in info.xml to derive the docs.civicrm.org shortname."
            exit 1
          }
          URL="https://docs.civicrm.org/admin/publish/${SHORTNAME}/en/master"
          echo "Notifying $URL"
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL") || HTTP_CODE="curl failed"
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "docs.civicrm.org notified successfully (HTTP $HTTP_CODE)"
          else
            echo "::warning::docs.civicrm.org publish webhook returned $HTTP_CODE for $URL, the release itself is unaffected."
          fi
