name: playwright frontend tests

on:
  workflow_call:
    inputs:
      EXTENSION_NAME:
        description: 'Name of the component under test (also the folder it is mounted under)'
        required: false
        default: ${{ github.event.repository.name }}
        type: string
      COMPONENT_TYPE:
        description: >
          What kind of component this repo is, which decides where it is mounted and how it
          is installed: 'extension' mounts under the CiviCRM extensions directory and enables
          it with `cv ext:enable`; 'plugin' mounts under wp-content/plugins and activates it
          with `wp plugin activate`. Defaults to 'extension' so existing callers are unaffected.
        required: false
        default: 'extension'
        type: string
      EXTENSION_KEY:
        description: 'CiviCRM extension key used to enable it (defaults to EXTENSION_NAME). Ignored when COMPONENT_TYPE is plugin.'
        required: false
        default: ''
        type: string
      PLAYWRIGHT_DIR:
        description: 'Directory (relative to the repo root) containing package.json and playwright.config.ts'
        required: false
        default: 'tests/playwright'
        type: string
      SETUP_SCRIPT:
        description: >
          Optional path (relative to the repo root) to a repo-specific shell script that runs
          after WordPress/CiviCRM/the component are up, before the Playwright tests. Use it to
          create test users/roles and seed data. Runs as www-data with its working directory set
          to the component's folder inside the WordPress container, so it can call `wp` and `cv`
          directly.
        required: false
        default: ''
        type: string
      NODE_VERSION:
        description: 'Node.js version to run Playwright with'
        required: false
        default: '20'
        type: string
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  playwright:
    runs-on: ubuntu-latest

    env:
      DB_NAME: wordpress
      DB_USER: wp_user
      DB_PASS: wp_pass
      DB_ROOT_PASS: root_pass
      DB_HOST: mariadb:3306
      WP_URL: http://localhost:8080
      WP_TITLE: Test Site
      WP_ADMIN_USER: admin
      WP_ADMIN_PASS: admin
      WP_ADMIN_EMAIL: test@example.com
      EXTENSION_KEY: ${{ inputs.EXTENSION_KEY != '' && inputs.EXTENSION_KEY || inputs.EXTENSION_NAME }}
      # Where the repo is mounted inside the WordPress container. A WordPress plugin has to
      # live under wp-content/plugins for WordPress to load it at all; a CiviCRM extension
      # lives under the CiviCRM extensions directory. Derived once here so the volume mount,
      # the setup script's working directory and CIVI_EXEC_PREFIX can never disagree.
      COMPONENT_DIR: ${{ inputs.COMPONENT_TYPE == 'plugin'
        && format('/var/www/html/wp-content/plugins/{0}', inputs.EXTENSION_NAME)
        || format('/var/www/html/wp-content/uploads/civicrm/ext/{0}', inputs.EXTENSION_NAME) }}

    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_DATABASE: ${{ env.DB_NAME }}
          MYSQL_USER: ${{ env.DB_USER }}
          MYSQL_PASSWORD: ${{ env.DB_PASS }}
          MYSQL_ROOT_PASSWORD: ${{ env.DB_ROOT_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Detect GitHub Actions Docker network
        id: detect-network
        run: |
          NETWORK=$(docker network ls --filter "name=github_" --format "{{ .Name }}" | head -n 1)
          echo "Detected Docker network: $NETWORK"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"

      - name: Start WordPress container
        run: |
          docker run -d --name wordpress \
            --network ${{ steps.detect-network.outputs.network }} \
            -e WORDPRESS_DB_HOST=${{ env.DB_HOST }} \
            -e WORDPRESS_DB_NAME=${{ env.DB_NAME }} \
            -e WORDPRESS_DB_USER=${{ env.DB_USER }} \
            -e WORDPRESS_DB_PASSWORD=${{ env.DB_PASS }} \
            -p 8080:80 \
            -v .:${{ env.COMPONENT_DIR }} \
            docker.io/agilewareprojects/wordpress:pipeline-latest

      - name: Wait for WordPress container startup
        run: |
          echo "Waiting for wp-config.php to exist in the container..."
          for i in {1..30}; do
            if docker exec wordpress test -f /var/www/html/wp-config.php; then
              echo "wp-config.php found!"
              break
            fi
            echo "Still waiting... ($i)"
            sleep 2
          done

          if ! docker exec wordpress test -f /var/www/html/wp-config.php; then
            echo "Timed out waiting for wp-config.php"
            exit 1
          fi

      - name: Install WordPress
        run: |
          docker exec -u www-data wordpress wp core install \
            --url=${{ env.WP_URL }} \
            --title="${{ env.WP_TITLE }}" \
            --admin_user=${{ env.WP_ADMIN_USER }} \
            --admin_password=${{ env.WP_ADMIN_PASS }} \
            --admin_email=${{ env.WP_ADMIN_EMAIL }} \
            --skip-email

      - name: Increase PHP memory limit
        run: |
          # The image's default 128M is enough for plain WordPress, but not
          # for civicrm's own install/upgrade routines (cv core:install has
          # hit "Allowed memory size of 134217728 bytes exhausted" fatals).
          docker exec wordpress bash -c "echo 'memory_limit = 512M' > /usr/local/etc/php/conf.d/zz-memory-limit.ini"
          docker exec wordpress apache2ctl graceful 2>/dev/null || true

      - name: Install and activate the Astra theme
        run: |
          # Pin a specific, known theme rather than relying on whichever
          # theme WordPress core ships as its current default - a future
          # WordPress release changing that default would otherwise change
          # the rendered markup out from under these tests with no warning.
          docker exec -u www-data wordpress wp theme install astra --activate

      - name: Configure WordPress permalinks
        run: |
          # CiviCRM's clean URLs (e.g. /civicrm/dashboard) depend on WordPress
          # NOT using the default "Plain" permalink structure - with Plain
          # permalinks, CiviCRM falls back to page_id/query-string URLs
          # instead, which frontend tests written against the documented
          # /civicrm/... paths won't resolve. The actual rewrite *flush*
          # happens later, once civicrm is installed and active - it's the
          # one that persists civicrm's own `civicrm/(.*)` rewrite rule,
          # which civicrm only registers while its plugin is active.
          docker exec -u www-data wordpress wp rewrite structure '/%postname%/' --hard

      - name: Download & install cv and civix
        run: |
          curl -Ls https://download.civicrm.org/cv/cv.phar -o /tmp/cv
          curl -Ls https://download.civicrm.org/civix/civix.phar -o /tmp/civix
          docker cp /tmp/cv wordpress:/usr/local/bin/cv
          docker cp /tmp/civix wordpress:/usr/local/bin/civix
          docker exec wordpress chmod +x /usr/local/bin/cv /usr/local/bin/civix

      - name: Install civicrm
        run: |
          # An extension repo gets wp-content/uploads/civicrm for free, because its bind mount
          # (.../uploads/civicrm/ext/<name>) makes Docker create the whole parent chain. A
          # plugin repo mounts elsewhere, so the directory only exists if the image ships it -
          # created explicitly here so both component types start from the same state.
          docker exec wordpress mkdir -p wp-content/uploads/civicrm
          docker exec wordpress chown www-data wp-content/ wp-content/uploads wp-content/uploads/civicrm
          # -f because core:install PROMPTS when a civicrm.settings.php already exists, and a
          # prompt with no TTY takes its default - abort - and fails the run. The container is
          # rebuilt from the image every run, so overwriting a stale settings file is exactly
          # what we want; with no settings file present the flag changes nothing.
          docker exec -u www-data wordpress cv core:install -f
          docker exec -u www-data wordpress wp plugin activate civicrm

      - name: Create CiviCRM WordPress base page
        run: |
          # CiviCRM's WordPress integration renders itself through a
          # dedicated WordPress page (identified by the "wpBasePage"
          # setting, matched by slug) rather than needing a shortcode in the
          # page body - without this, CiviCRM has no base page to route
          # clean URLs through.
          docker exec -u www-data wordpress wp post create \
            --post_type=page \
            --post_title=CiviCRM \
            --post_name=civicrm \
            --post_status=publish
          docker exec -u www-data wordpress cv api4 Setting.set '{"values": {"wpBasePage": "civicrm"}}'

      - name: Flush WordPress rewrite rules
        run: |
          # Only now - with civicrm active and its base page/setting in
          # place - does civicrm's own rewrite rule (registered while its
          # plugin is active) get included when the rules are persisted.
          # Flushing any earlier would miss it entirely.
          docker exec -u www-data wordpress wp rewrite flush --hard

      - name: Enable extension under test
        if: ${{ inputs.COMPONENT_TYPE != 'plugin' }}
        run: |
          docker exec -u www-data wordpress cv ext:enable ${{ env.EXTENSION_KEY }}

      - name: Activate plugin under test
        if: ${{ inputs.COMPONENT_TYPE == 'plugin' }}
        run: |
          # A WordPress plugin is activated through wp-cli rather than cv - it has no
          # info.xml, so CiviCRM would not recognise it as an extension at all.
          docker exec -u www-data wordpress wp plugin activate ${{ inputs.EXTENSION_NAME }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ inputs.PLAYWRIGHT_DIR }}/package-lock.json

      - name: Install Playwright test dependencies
        working-directory: ${{ inputs.PLAYWRIGHT_DIR }}
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ${{ inputs.PLAYWRIGHT_DIR }}
        run: npx playwright install --with-deps

      - name: Run repo-specific test environment setup
        if: ${{ inputs.SETUP_SCRIPT != '' }}
        run: |
          docker exec -u www-data -w ${{ env.COMPONENT_DIR }} wordpress bash "${{ inputs.SETUP_SCRIPT }}"

      - name: Run Playwright tests
        working-directory: ${{ inputs.PLAYWRIGHT_DIR }}
        env:
          BASE_URL: ${{ env.WP_URL }}
          WP_ADMIN_USER: ${{ env.WP_ADMIN_USER }}
          WP_ADMIN_PASS: ${{ env.WP_ADMIN_PASS }}
          CIVI_EXEC_PREFIX: docker exec -u www-data -w ${{ env.COMPONENT_DIR }} wordpress
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ inputs.PLAYWRIGHT_DIR }}/playwright-report/
          retention-days: 14

      - name: Upload Playwright screenshots/traces
        # Same failure screenshots/traces as the HTML report above, but as
        # plain files under a per-test directory name - faster to browse
        # individually than digging through the report's hashed filenames.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: ${{ inputs.PLAYWRIGHT_DIR }}/test-results/
          retention-days: 14

      - name: Collect docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2.2.2
        with:
          dest: './logs'

      - name: Tar logs
        if: failure()
        run: tar cvzf ./logs.tgz ./logs

      - name: Upload logs to GitHub
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs.tgz
          path: ./logs.tgz
